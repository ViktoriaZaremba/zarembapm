<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank CV Template</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --deep-navy: #062B57;
            --warm-sand: #F4F0EC;
            --soft-gold: #D8A24A;
            --steel-blue: #7F95B2;
            --grid-gray: #D9D6D2;
            --white: #FFFFFF;
        }

        @page {
            size: A4;
            margin: 0;
        }

        body {
            font-family: 'Inter', 'Manrope', system-ui, sans-serif;
            background: var(--white);
            color: var(--deep-navy);
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .page {
            width: 210mm;
            height: 297mm;
            max-height: 297mm;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: var(--warm-sand);
            padding: 10mm;
        }

        /* Left Sidebar */
        .sidebar {
            background: var(--white);
            padding: 10mm 5mm 10mm 5mm;
            position: relative;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: 12mm;
            left: 0;
            width: 2px;
            height: 50mm;
            background: var(--soft-gold);
            opacity: 0.6;
        }

        .sidebar::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 1px;
            height: 100%;
            background: var(--grid-gray);
        }

        /* Right Main Content */
        .main {
            padding: 10mm 9mm 10mm 9mm;
            background: var(--warm-sand);
        }

        /* Data curve decoration */
        .decoration {
            position: absolute;
            bottom: 6mm;
            left: 5mm;
            right: 5mm;
            height: 10mm;
            opacity: 0.15;
        }

        .decoration svg {
            width: 100%;
            height: 100%;
        }

        @media print {
            body {
                background: white;
            }
            .page {
                margin: 0;
                box-shadow: none;
            }
        }

        @media screen {
            body {
                background: #e8e8e8;
                padding: 20px 0;
            }
            .page {
                box-shadow: 0 2px 20px rgba(6, 43, 87, 0.08);
            }
        }
    </style>
</head>
<body>

<div class="page">
    <!-- Background line pattern: concentric arcs, top-right -->
    <svg style="position: absolute; top: -15mm; right: -10mm; width: 75mm; height: 75mm; z-index: 1;" viewBox="0 0 300 300">
        <circle cx="150" cy="150" r="140" fill="none" stroke="#D9D6D2" stroke-width="1" opacity="0.3"/>
        <circle cx="150" cy="150" r="105" fill="none" stroke="#D8A24A" stroke-width="1" opacity="0.22"/>
        <circle cx="150" cy="150" r="70" fill="none" stroke="#7F95B2" stroke-width="1.2" opacity="0.28"/>
        <circle cx="150" cy="150" r="35" fill="none" stroke="#D9D6D2" stroke-width="1" opacity="0.2"/>
        <!-- Accent points -->
        <circle cx="95" cy="95" r="4" fill="#D8A24A" opacity="0.5"/>
        <circle cx="95" cy="95" r="2" fill="#062B57" opacity="0.45"/>
        <circle cx="220" cy="80" r="3" fill="#7F95B2" opacity="0.35"/>
    </svg>

    <!-- Dot pattern top-left -->
    <svg style="position: absolute; top: 4mm; left: 3mm; width: 10mm; height: 10mm; opacity: 0.5; z-index: 1;" viewBox="0 0 50 50">
        <circle cx="5" cy="5" r="2" fill="#D8A24A"/>
        <circle cx="15" cy="5" r="2" fill="#D8A24A" opacity="0.8"/>
        <circle cx="25" cy="5" r="1.5" fill="#D8A24A" opacity="0.6"/>
        <circle cx="35" cy="5" r="1.2" fill="#7F95B2" opacity="0.5"/>
        <circle cx="5" cy="15" r="1.5" fill="#D8A24A" opacity="0.6"/>
        <circle cx="15" cy="15" r="1.2" fill="#7F95B2" opacity="0.4"/>
        <circle cx="25" cy="15" r="1.2" fill="#D9D6D2" opacity="0.5"/>
        <circle cx="5" cy="25" r="1.2" fill="#7F95B2" opacity="0.4"/>
        <circle cx="15" cy="25" r="1" fill="#D9D6D2" opacity="0.4"/>
        <circle cx="5" cy="35" r="1" fill="#D9D6D2" opacity="0.3"/>
    </svg>

    <!-- Sidebar -->
    <aside class="sidebar" style="display: none;">
        <div class="decoration">
            <svg viewBox="0 0 200 80" preserveAspectRatio="none">
                <!-- Concentric arcs bottom-left of sidebar -->
                <circle cx="0" cy="80" r="70" fill="none" stroke="#D9D6D2" stroke-width="1" opacity="0.3"/>
                <circle cx="0" cy="80" r="50" fill="none" stroke="#D8A24A" stroke-width="1" opacity="0.2"/>
                <circle cx="0" cy="80" r="30" fill="none" stroke="#7F95B2" stroke-width="1" opacity="0.25"/>
                <circle cx="45" cy="35" r="3" fill="#D8A24A" opacity="0.45"/>
                <circle cx="45" cy="35" r="1.5" fill="#062B57" opacity="0.4"/>
            </svg>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main" style="padding: 0;">
    </main>

    <!-- Bottom decoration -->
    <svg style="position: absolute; bottom: 8mm; left: 10mm; width: 40mm; height: 15mm; opacity: 0.15; z-index: 1;" viewBox="0 0 150 60">
        <!-- Concentric arcs bottom-left -->
        <circle cx="0" cy="60" r="55" fill="none" stroke="#D9D6D2" stroke-width="1" opacity="0.35"/>
        <circle cx="0" cy="60" r="40" fill="none" stroke="#D8A24A" stroke-width="1.2" opacity="0.3"/>
        <circle cx="0" cy="60" r="25" fill="none" stroke="#7F95B2" stroke-width="1" opacity="0.4"/>
        <circle cx="0" cy="60" r="10" fill="none" stroke="#D9D6D2" stroke-width="0.8" opacity="0.25"/>
        <!-- Accent points -->
        <circle cx="32" cy="28" r="2.5" fill="#D8A24A" opacity="0.5"/>
        <circle cx="32" cy="28" r="1.2" fill="#062B57" opacity="0.45"/>
        <circle cx="48" cy="18" r="2" fill="#7F95B2" opacity="0.4"/>
    </svg>

    <!-- Bottom right accent line with dots -->
    <svg style="position: absolute; bottom: 10mm; right: 10mm; width: 30mm; height: 12mm; opacity: 0.2; z-index: 1;" viewBox="0 0 100 40">
        <!-- Horizontal gold line -->
        <line x1="0" y1="20" x2="100" y2="20" stroke="#D8A24A" stroke-width="2" opacity="0.5"/>
        <!-- Dot pattern -->
        <circle cx="15" cy="8" r="2" fill="#D8A24A" opacity="0.6"/>
        <circle cx="28" cy="8" r="2" fill="#D8A24A" opacity="0.5"/>
        <circle cx="41" cy="8" r="1.5" fill="#7F95B2" opacity="0.5"/>
        <circle cx="54" cy="8" r="1.5" fill="#D9D6D2" opacity="0.6"/>
        <circle cx="15" cy="32" r="1.5" fill="#7F95B2" opacity="0.5"/>
        <circle cx="28" cy="32" r="1.5" fill="#D9D6D2" opacity="0.5"/>
        <circle cx="41" cy="32" r="1.2" fill="#D8A24A" opacity="0.4"/>
    </svg>
</div>

</body>
</html>
